name: variance tick

# The box in the `variance` comment. A reviewer with write access ticks it, and
# this names them in the comment and runs the check again, which accepts in the
# pull request's own cache scope. It runs from `main` and reads none of the pull
# request's code.

on:
  issue_comment:
    types: [edited]

permissions:
  actions: write # the rerun
  pull-requests: write # the name, in the comment

jobs:
  tick:
    if: github.event.issue.pull_request && github.event.comment.user.type == 'Bot' && github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: variance-tick-${{ github.event.comment.id }}
      cancel-in-progress: false
    steps:
      - uses: Variance-Authority/action/tick@v1
